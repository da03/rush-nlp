name: Paper links

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: ruby scripts/test_paper_links.rb
      - run: gem install jekyll -v 4.3.4 --no-document
      - run: ruby scripts/test_dataset_metadata.rb
