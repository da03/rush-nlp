<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">

  {% include head.html %}

  <body>

    <a class="skip-link" href="#main">{% if page.lang == 'zh-Hans' %}跳至正文{% else %}Skip to main content{% endif %}</a>

    {% include header.html %}

    <main id="main" class="page-content" tabindex="-1">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}

    {% unless page.helper == false %}{% include helper.html %}{% endunless %}

    <script src="{{ '/js/theme.js' | prepend: site.baseurl }}" defer></script>
    <script src="{{ '/js/nav.js' | prepend: site.baseurl }}" defer></script>

  </body>

</html>
