# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Yuntian Deng
email: yuntian@uwaterloo.ca
description: "Yuntian Deng is an Assistant Professor at Waterloo working on ProgramAsWeights, NeuralOS, implicit chain of thought, and real-world language-model use."
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://yuntiandeng.com" # the base hostname & protocol, without a trailing slash
twitter_username: yuntiandeng
github_username: da03

# Build settings
markdown: kramdown
highlighter: rouge

# Server-side helper backend and the (reference-only) PAW website clone are not
# part of the static site; keep them out of the Jekyll build / GitHub Pages output.
exclude:
  - helper/
  - programasweights_website/
