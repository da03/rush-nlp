- id: programasweights
  title: ProgramAsWeights (PAW)
  description: A new programming paradigm that replaces symbolic code for fuzzy functions with compiled neural programs. Towards programming without code as an intermediary.
  links:
    - title: programasweights.com
      url: https://programasweights.com
- id: neuralos
  title: Neural World Models
  description: Can generative models learn the behavior of interactive computing environments? We explore this through NeuralOS, which uses a neural generative model to simulate an operating system end to end.
  links:
    - title: NeuralOS
      url: https://neural-os.com
    - title: Reading list
      url: https://neural-os.com/reading-list/
- id: implicit-chain-of-thought
  title: Implicit Chain of Thought
  description: "We first proposed implicit chain-of-thought reasoning (also called latent reasoning) in 2023: using continuous hidden states instead of writing out intermediate steps. Our work includes knowledge distillation and step-by-step internalization."
  links:
    - title: 2023 paper
      url: https://arxiv.org/pdf/2311.01460.pdf
    - title: 2024 paper
      url: https://arxiv.org/pdf/2405.14838
